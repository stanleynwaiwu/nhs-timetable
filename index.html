<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NHS Labs · Instructor Timetable</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 1) Loading -->
  <div id="boot" class="boot"><div class="spin" aria-label="Loading"></div></div>

  <!-- 2) Sign in / create account / waiting for approval -->
  <div id="auth" class="auth" hidden></div>

  <!-- 3) The app (only for signed-in, approved people) -->
  <div id="app" hidden>
    <header class="top">
      <div class="brand">
        <h1>Instructor Timetable</h1>
        <p>Book a lab. Nobody else can take it at the same time.</p>
      </div>
      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="onlyMine" />
          <span>Highlight only mine</span>
        </label>
        <span id="status" class="status" title="Connection status">●</span>
        <button id="acct" class="acct" type="button" aria-label="Your account"></button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <nav id="sections" class="sections" aria-label="Sections" hidden></nav>

    <div id="sec-timetable">
      <section class="legend" id="legend"></section>

      <main class="wrap">
        <div id="grid" class="grid" role="table" aria-label="Weekly timetable"></div>
      </main>

      <!-- Phone / small-tablet view (hidden on desktop by CSS) -->
      <div id="mobile" class="mobile"></div>
    </div>

    <section id="sec-admin" class="admin" hidden></section>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h2 id="dlgTitle"></h2>
      <div id="dlgBody"></div>
      <div class="actions" id="dlgActions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
